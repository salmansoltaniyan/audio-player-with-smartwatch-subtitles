name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Phone and watch APKs must be signed with the SAME key, so the key comes from
      # repository secrets (never from the repository itself).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See README.md, section Building."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :phone:assembleRelease :wear:assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/release/phone-release.apk out/lesson-subtitles-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk out/lesson-subtitles-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: out/lesson-subtitles-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: out/lesson-subtitles-watch.apk

      # The phone app's "Check for update" button reads the latest release.
      # The tag "build-<number>" must match Updater.TAG_PREFIX in the phone module.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "Version 0.1.${{ github.run_number }}" \
              --notes "Built from commit ${{ github.sha }}." \
              --target "${{ github.sha }}"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
